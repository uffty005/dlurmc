<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>99 乘法表</title>
  <style>
    :root{ --bg:#f6f8fa; --card:#fff; --accent:#0f62fe; --muted:#6b7280 }
    html,body{height:100%}
    body{
      margin:0;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background:linear-gradient(180deg,var(--bg),#ffffff);
      display:flex;align-items:center;justify-content:center;padding:24px;
      color:#111827;
    }
    .wrap{width:100%;max-width:820px}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
    h1{font-size:20px;margin:0}
    p.desc{margin:0;color:var(--muted);font-size:13px}

    .card{background:var(--card);border-radius:12px;padding:18px;box-shadow:0 6px 24px rgba(15,23,42,0.06)}
    table{border-collapse:collapse;width:100%;table-layout:fixed}
    th,td{padding:10px 8px;text-align:center;border:1px solid rgba(15,23,42,0.06)}
    th{background:#f3f4f6;font-weight:600}
    td{background:linear-gradient(180deg,#fff,#fbfdff)}
    td.product{font-weight:700;color:var(--accent)}

    /* responsive: show grid on small screens */
    @media (max-width:520px){
      table,thead,tbody,tr,th,td{display:block}
      thead{display:none}
      tr{margin-bottom:10px}
      td{border:1px solid rgba(15,23,42,0.06);position:relative;padding-left:50%}
      td::before{position:absolute;left:12px;top:8px;white-space:nowrap;font-weight:600}
      /* provide labels via data-label attribute filled by JS */
    }
    .controls{display:flex;gap:8px;align-items:center}
    .btn{background:var(--accent);color:white;padding:8px 12px;border-radius:8px;border:none;cursor:pointer}
    .btn.secondary{background:#eef2ff;color:var(--accent)}
    footer{margin-top:12px;color:var(--muted);font-size:13px}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>99 乘法表</h1>
        <p class="desc">显示 1 到 9 的乘法表（九九表）。可打印并适配小屏幕。</p>
      </div>
      <div class="controls">
        <button class="btn" onclick="print()">打印 / 保存为 PDF</button>
        <button class="btn secondary" onclick="toggleHighlight()">切换高亮对角线</button>
      </div>
    </header>

    <div class="card" id="tableWrap" aria-live="polite">
      <table id="mulTable" role="table" aria-label="九九乘法表">
        <thead>
          <tr>
            <th>×</th>
            <!-- headers 1..9 inserted by JS -->
          </tr>
        </thead>
        <tbody>
          <!-- body generated by JS -->
        </tbody>
      </table>
    </div>

    <footer>提示：在小屏设备上每一行会变成卡片形式以便阅读。</footer>
  </div>

  <script>
    const max = 9;
    const theadRow = document.querySelector('#mulTable thead tr');
    const tbody = document.querySelector('#mulTable tbody');

    // build header
    for(let j=1;j<=max;j++){
      const th = document.createElement('th');
      th.textContent = j;
      theadRow.appendChild(th);
    }

    // build body rows
    for(let i=1;i<=max;i++){
      const tr = document.createElement('tr');
      const th = document.createElement('th');
      th.textContent = i;
      tr.appendChild(th);
      for(let j=1;j<=max;j++){
        const td = document.createElement('td');
        td.dataset.label = `${i} × ${j}`; // for mobile pseudo-label
        const prod = i*j;
        td.textContent = prod;
        td.className = 'product';
        // optional: add title for accessibility
        td.title = `${i} × ${j} = ${prod}`;
        // highlight diagonal (e.g., squares)
        if(i===j) td.style.background = 'linear-gradient(180deg,#fff7ed,#fff)';
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }

    // For small-screen labels: fill ::before using element's data-label
    // We'll add small inline styles to set content via attr()
    // But CSS pseudo-element content can read attribute, so no JS needed beyond data-label.

    // Toggle highlight example (toggle border accent for diagonal)
    let highlighted = true;
    function toggleHighlight(){
      highlighted = !highlighted;
      document.querySelectorAll('#mulTable td').forEach((td,idx)=>{
        const r = Math.floor(idx/max)+1;
        const c = idx%max+1;
        if(r===c){
          td.style.boxShadow = highlighted ? 'inset 0 0 0 2px rgba(15,99,255,0.12)' : '';
        }
      })
    }

    // Improve mobile: set CSS variable for each td ::before content via attribute
    // Already set data-label so CSS can use attr(data-label) in ::before

    // Accessibility: keyboard focus styles
    document.addEventListener('keydown', e=>{
      if(e.key==='/' && !e.metaKey && !e.ctrlKey){
        e.preventDefault();
        alert('Use the buttons to print or toggle highlight.');
      }
    });
  </script>
</body>
</html>
